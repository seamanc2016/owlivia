services:
  - type: web
    name: owlivia-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: python -m pip install --upgrade pip && python -m pip install -r requirements-render.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"

      - key: ENVIRONMENT
        value: production

      - key: RAG_GENERATION_MODE
        value: gemini

      - key: GEMINI_MODEL_NAME
        value: gemini-3.1-flash-lite

      - key: GEMINI_API_KEY
        sync: false

      - key: RAG_DENSE_ENABLED
        value: "false"

      - key: ALLOWED_ORIGINS
        value: https://owlivia.vercel.app